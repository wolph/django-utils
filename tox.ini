[tox]
requires =
    tox-uv>=1.0
env_list =
    py310-django{42,52}
    py311-django{42,52}
    py312-django{42,52,60}
    py313-django{52,60}
    py314-django60
    lint
    mypy
    docs
    coverage
skip_missing_interpreters = true

# ── Test matrix ──────────────────────────────────────────────

[testenv]
description = Run tests under {base_python} with {env_name}
# Always build envs fresh: tox fingerprints cached envs by the literal
# `deps` list, so changes INSIDE the `.[tests]` extra (a new package
# added to pyproject.toml) are invisible to it and leave cached envs
# silently broken — this repo hit that three times (django-coverage-
# plugin, cryptography, and a django-stubs version skew). uv makes a
# fresh env ~2s, so correctness-by-default is cheap. One-off opt-out:
# `tox -x testenv.recreate=false -e <env>`.
recreate = true
deps =
    .[tests]
    django42: Django>=4.2,<4.3
    django52: Django>=5.2,<5.3
    django60: Django>=6.0,<6.1
commands =
    pytest --cov-report= {posargs}
# PYTHONPATH makes the `tests` package importable (the wheel only ships
# django_utils). Side effect: the checkout shadows the installed package,
# so tox envs test the source tree, not the built wheel. That is accepted
# here by design: pytest collects doctests from the source tree anyway,
# and wheel integrity is verified separately (wheel smoke test in
# publish.yml's build job).
set_env =
    COVERAGE_FILE = {toxworkdir}/.coverage.{env_name}
    PYTHONPATH = {tox_root}

# ── PostgreSQL (opt-in, real backend) ───────────────────────

# Runs the FULL suite against PostgreSQL 16, not merely the tests
# carrying the `postgres` pytest marker -- a deliberate deviation from
# the spec's "a postgres marker; one tox env running the marked tests"
# text: every ORM-touching test gets cross-backend coverage this way,
# not a hand-picked subset (see CHANGELOG). The `postgres` marker still
# exists, registered in tests/conftest.py, for FUTURE PostgreSQL-only
# tests (e.g. Phase E's ENUM field) that have no sqlite equivalent to
# fall back to.
#
# Deliberately absent from `env_list` above: without a running
# PostgreSQL server (POSTGRES_HOST/PORT/USER/PASSWORD env, defaults
# 127.0.0.1/5432/postgres/postgres), tests fail loudly at connection --
# fine for an explicit `tox -e py313-django52-postgres`, not for a bare
# `tox` run other contributors expect to pass with sqlite alone. Not in
# `[testenv:coverage]`'s `depends` either: CI runs this as its own job
# (a `services: postgres:` container), and its coverage doesn't feed
# the combined 100% gate -- a local run without a server never
# generates one.
[testenv:py313-django52-postgres]
description = Run the full suite against PostgreSQL 16 (opt-in)
deps =
    .[tests]
    Django>=5.2,<5.3
    psycopg[binary]>=3.1
set_env =
    {[testenv]set_env}
    DJANGO_UTILS_TEST_POSTGRES = 1
pass_env =
    POSTGRES_HOST
    POSTGRES_PORT
    POSTGRES_USER
    POSTGRES_PASSWORD

# ── Lint ─────────────────────────────────────────────────────

[testenv:lint]
description = Lint with ruff
skip_install = true
deps = ruff>=0.15.0
commands =
    ruff check django_utils tests
    ruff format --check django_utils tests

# ── Type checking ────────────────────────────────────────────

[testenv:mypy]
description = Type-check with mypy (strict, django-stubs)
deps = .[dev]
commands = mypy

[testenv:basedpyright]
description = Type-check with basedpyright
deps = .[dev]
# --pythonpath pins pyright's import resolution to this tox env's
# interpreter. Without it, basedpyright auto-detects the project-root
# .venv and inspects *its* site-packages instead — green locally (dev
# deps installed there) but red in CI, where .venv only holds .[tox].
commands = basedpyright --pythonpath {env_python}

[testenv:pyrefly]
description = Type-check with pyrefly
deps = .[dev]
commands = pyrefly check

[testenv:ty]
description = Type-check with ty
deps = .[dev]
commands = ty check django_utils

# ── Docs ─────────────────────────────────────────────────────

[testenv:docs]
description = Build Sphinx documentation
deps = .[docs]
allowlist_externals =
    rm
    mkdir
commands =
    rm -f docs/modules.rst
    mkdir -p docs/_static
    sphinx-apidoc -o docs/ django_utils
    rm -f docs/modules.rst
    sphinx-build -W -b html -d docs/_build/doctrees docs docs/_build/html

# ── Coverage ─────────────────────────────────────────────────

[testenv:coverage]
description = Combine coverage from test envs and enforce threshold
skip_install = true
# django-coverage-plugin (and Django, which it imports) must be present
# at combine/report time too: the data files reference the plugin for
# every measured template, and reporting re-parses the templates.
deps =
    coverage>=7.0
    django-coverage-plugin>=3.1
    Django>=4.2
depends =
    py310-django{42,52}
    py311-django{42,52}
    py312-django{42,52,60}
    py313-django{52,60}
    py314-django60
set_env =
    COVERAGE_FILE = {toxworkdir}/.coverage
commands =
    coverage combine {toxworkdir}
    coverage report --fail-under=100
