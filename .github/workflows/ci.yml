name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:
  # Allows publish.yml to run the full test suite as a release gate.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
      - run: uv pip install '.[tox]'
      - run: tox -e lint

  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
      - run: uv pip install '.[tox]'
      - run: tox -e mypy,basedpyright,pyrefly,ty

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        django-version: [django42, django52, django60]
        exclude:
          - { python-version: '3.13', django-version: django42 }
          - { python-version: '3.14', django-version: django42 }
          - { python-version: '3.14', django-version: django52 }
          - { python-version: '3.10', django-version: django60 }
          - { python-version: '3.11', django-version: django60 }
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
          python-version: ${{ matrix.python-version }}
      - run: uv pip install '.[tox]'
      - name: Run tests
        run: tox -e py$(echo "${{ matrix.python-version }}" | tr -d .)-${{ matrix.django-version }}
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}-${{ matrix.django-version }}
          path: .tox/.coverage.*
          include-hidden-files: true

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
          python-version: '3.13'
      - run: uv pip install '.[tox]'
      - name: Run tests against PostgreSQL
        run: tox -e py313-django52-postgres

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
      - run: uv pip install '.[tox]'
      - run: tox -e docs

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
      - run: uv pip install '.[tox]'
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: .tox
          merge-multiple: true
      - run: tox -e coverage
