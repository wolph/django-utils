name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:
  # Allows publish.yml to run the full test suite as a release gate.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
      - run: uv pip install '.[tox]'
      - run: tox -e lint

  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
      - run: uv pip install '.[tox]'
      - run: tox -e mypy,basedpyright,pyrefly,ty

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        django-version: [django42, django52, django60]
        exclude:
          - { python-version: '3.13', django-version: django42 }
          - { python-version: '3.14', django-version: django42 }
          - { python-version: '3.14', django-version: django52 }
          - { python-version: '3.10', django-version: django60 }
          - { python-version: '3.11', django-version: django60 }
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
          python-version: ${{ matrix.python-version }}
      - run: uv pip install '.[tox]'
      - name: Run tests
        run: tox -e py$(echo "${{ matrix.python-version }}" | tr -d .)-${{ matrix.django-version }}
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}-${{ matrix.django-version }}
          path: .tox/.coverage.*
          include-hidden-files: true

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
          python-version: '3.13'
      - run: uv pip install '.[tox]'
      - name: Run tests against PostgreSQL
        run: tox -e py313-django52-postgres

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
      - run: uv pip install '.[tox]'
      - run: tox -e docs

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
      - run: uv pip install '.[tox]'
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: .tox
          merge-multiple: true
      - run: tox -e coverage
      - name: Upload combined coverage to Coveralls
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/')
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: .tox/coverage.lcov
          format: lcov
          fail-on-error: true

  # Dependabot opens against the default branch whenever target-branch is
  # absent, and its security updates ignore target-branch entirely and always
  # use the default branch. Either route lands a commit on master, which
  # re-diverges it from develop and turns the next release merge into a
  # conflict resolution. Both invariants are one line of config each and
  # neither announces itself when it changes, so assert them here.
  repo-config:
    name: Repository configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: false
      - name: Dependabot and the default branch both point at develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')"
          export DEFAULT_BRANCH="$default_branch"
          uv run --no-project --with pyyaml python - <<'PY'
          import os
          import pathlib
          import sys

          import yaml

          WANTED = 'develop'
          problems: list[str] = []

          default_branch: str = os.environ['DEFAULT_BRANCH']
          if default_branch != WANTED:
              problems.append(
                  f'the default branch is {default_branch!r}, not {WANTED!r}. '
                  f'Dependabot security updates always open against the '
                  f'default branch and cannot be redirected.'
              )

          # This repository runs security updates only, so the config file is
          # optional. Once it exists, every entry has to name develop, because
          # an entry without target-branch falls back to the default branch of
          # the day rather than to develop by name.
          config_path: pathlib.Path = pathlib.Path('.github/dependabot.yml')
          updates: list[dict[str, object]] = []
          if config_path.exists():
              config: dict[str, object] = yaml.safe_load(
                  config_path.read_text()
              )
              updates = config.get('updates') or []
              if not updates:
                  problems.append('.github/dependabot.yml declares no updates')

              for entry in updates:
                  ecosystem: object = entry.get('package-ecosystem', '<unnamed>')
                  directory: object = entry.get('directory', '<unset>')
                  target: object = entry.get('target-branch')
                  if target != WANTED:
                      problems.append(
                          f'{ecosystem} in {directory} targets {target!r}, '
                          f'not {WANTED!r}'
                      )

          if problems:
              for problem in problems:
                  print(f'error: {problem}', file=sys.stderr)
              sys.exit(1)

          print(
              f'The default branch and {len(updates)} Dependabot update(s) '
              f'all point at {WANTED!r}.'
          )
          PY
