name: Publish to PyPI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # Re-run the full test suite so nothing reaches PyPI without passing.
  test:
    uses: ./.github/workflows/ci.yml

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
      - name: Build
        run: uv build
      - name: Smoke test wheel
        run: |
          uv run --isolated --no-project --with dist/django_utils2-*.whl \
            python -c "import django_utils, django_utils.choices, django_utils.view_decorators; print('wheel import OK')"
          unzip -l dist/django_utils2-*.whl | grep -q 'admin/dropdown_filter.html'
          unzip -l dist/django_utils2-*.whl | grep -q 'py.typed'
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
